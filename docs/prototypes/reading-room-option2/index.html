 {title:'Meditations',author:'Marcus Aurelius',category:'Philosophy',color:'#344b43',foil:'#e4d7ac',height:205,lean:-2,motif:'arches',ribbon:true,copy:'A possible note could live here: a small reflection on attention, perspective, and the distance between what happens and how we respond.',thought:'What’s worth paying attention to?'},

 {title:'The Creative Act',author:'Rick Rubin',category:'Philosophy',color:'#ded5bf',foil:'#494b3f',height:211,lean:-1,motif:'circles',copy:'Not a full review. Just the piece you want to remember: a practice, an observation, or a reminder to leave more room for curiosity.',thought:'Make room for noticing before making something.'},

 {id:'mental-models',title:'Mental models',topic:'Thinking clearly',kind:'Living note',summary:'A small toolbox for looking at a problem from more than one angle.',outline:['A lens, not a rule','Three useful questions','Keep the exceptions'],body:[['A lens, not a rule','A model is useful when it helps me notice something I would otherwise miss. I want a few ways to think, without turning any one of them into an answer to everything.'],['Three useful questions','What am I assuming? What would change my mind? If this goes well immediately, what might happen next? These questions slow down the jump from a convincing story to a decision.'],['Keep the exceptions','The interesting part of a model is often where it breaks. I’d keep concrete examples and counterexamples here as this note grows.']],thought:'Try a second lens before committing to the first explanation.',refs:[{type:'book',index:3,label:'Related reading · explanations'},{type:'note',index:1,label:'Connected note · attention & control'}]},
 {id:'attention-and-control',title:'Attention & control',topic:'Philosophy in practice',kind:'Reading connection',summary:'A thought from a book, carried into everyday decisions.',outline:['Separate the two','A working practice'],body:[['Separate the two','There is the situation in front of me, and there is the response I can choose. When I mix those together, it becomes difficult to see where I can actually act.'],['A working practice','Before a difficult conversation, write down the part that is mine: preparation, clarity, listening. Leave space for the part that belongs to someone else. A future version of this note could include a specific passage and its edition or page number.']],thought:'Put the effort where there is a choice.',refs:[{type:'book',index:0,label:'Related book · Marcus Aurelius'},{type:'note',index:0,label:'Connected note · Mental models'}]},
 {id:'learning-in-public',title:'Learning in public',topic:'Learning & making',kind:'Loose thought',summary:'Keep the question, the experiment, and the thing that changed your mind.',outline:['Leave a trail','Keep it small'],body:[['Leave a trail','A useful note can start with a question instead of a conclusion. Keeping the unfinished version makes it possible to return later and see how my thinking moved.'],['Keep it small','One observation, one example, one next question. A link to the original source keeps the trail intact, while the note captures what I want to explore myself.']],thought:'A small, unfinished note is still a place to begin.',refs:[{type:'link',index:0,label:'Related blog · from your saved links'},{type:'note',index:0,label:'Connected note · Mental models'}]}
];
function volumeFaces(b,i){return `<span class="volume-face volume-front"><img class="cover-art" src="covers/${b.id}.svg" alt="" draggable="false"><span class="binding-groove"></span></span><span class="volume-face volume-back"><span class="small">Notes in the margins</span><p>${escapeHTML(b.thought)}</p><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1">${motifs[b.motif]}</svg><span class="small">The reading room · 0${i+1}</span></span><span class="volume-face volume-spine"><span>${escapeHTML(b.title)}</span><small>0${i+1}</small></span><span class="volume-face volume-pages"></span><span class="volume-face volume-top"></span><span class="volume-face volume-bottom"></span>`}
function bookMarkup(b,i){return `<span class="display-volume shelf-volume" style="--color:${b.color};--foil:${b.foil};--lean:${b.lean*.3}deg">${volumeFaces(b,i)}</span>`}

const escapeHTML=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
books.forEach((b,i)=>{b.id=['meditations','lessons-of-history','creative-act','beginning-of-infinity','room-of-ones-own','invention-of-nature'][i]});
const entries=[...notes.map(n=>({...n,type:'note',subtitle:n.topic,file:`notes/${n.id}.md`})),...books.map(b=>({...b,type:'book',subtitle:b.author,file:`notes/${b.id}.md`}))];
const reader=document.getElementById('reader'),article=document.getElementById('markdown');let activeType='note',activeId='',requestId=0;
// A deliberately small Markdown renderer for these local, authored documents.
// Escape text before rendering; only local fragment links and HTTPS sources become anchors.
function inline(text){return escapeHTML(text).replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,label,href)=>{if(!/^(#[a-z0-9/-]+|https:\/\/[^\s]+)$/i.test(href))return label;return `<a href="${href}"${href.startsWith('https:')?' target="_blank" rel="noopener noreferrer"':''}>${label}</a>`}).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>')}
function markdown(text){let out=[],paragraph=[],list=null;const flush=()=>{if(paragraph.length){out.push('<p>'+inline(paragraph.join(' '))+'</p>');paragraph=[]}if(list){out.push('</'+list+'>');list=null}};for(const line of text.split('\n')){let match;if(!line.trim()){flush();continue}if(match=line.match(/^(#{1,3}) (.+)$/)){flush();out.push(`<h${match[1].length}>${inline(match[2])}</h${match[1].length}>`)}else if(/^---+$/.test(line)){flush();out.push('<hr>')}else if(line.startsWith('> ')){flush();out.push('<blockquote><p>'+inline(line.slice(2))+'</p></blockquote>')}else if(match=line.match(/^(- |\d+\. )(.+)$/)){if(paragraph.length)flush();const kind=match[1]==='- '?'ul':'ol';if(list!==kind){if(list)out.push('</'+list+'>');list=kind;out.push('<'+kind+'>')}out.push('<li>'+inline(match[2])+'</li>')}else{if(list)flush();paragraph.push(line)}}flush();return out.join('')}
function renderCatalog(){const query=document.getElementById('search').value.toLowerCase();const group=entries.filter(e=>e.type===activeType);const shown=group.filter(e=>(e.title+' '+e.subtitle).toLowerCase().includes(query));const list=document.getElementById('catalog-list');list.replaceChildren();for(const e of shown){const a=document.createElement('a');a.href=`#${e.type}/${e.id}`;a.className='catalog-item';if(e.id===activeId)a.setAttribute('aria-current','page');a.innerHTML=`<strong>${escapeHTML(e.title)}</strong><small>${escapeHTML(e.subtitle)}</small>`;list.append(a)}document.getElementById('empty-search').hidden=shown.length>0;}
async function route(){const token=++requestId;const hash=location.hash.slice(1)||'shelf';const [kind,id]=hash.split('/');const isDoc=kind==='note'||kind==='book',isReader=isDoc||kind==='notes'||kind==='books';const isLinks=kind==='links';document.getElementById('shelf-page').hidden=isReader||isLinks;reader.hidden=!isReader;document.getElementById('links-page').hidden=!isLinks;document.body.classList.toggle('is-reading',isReader||isLinks);document.querySelectorAll('[data-section]').forEach(a=>{const section=isLinks?'links':isReader&&kind!=='book'&&kind!=='books'?'notes':'shelf';if(a.dataset.section===section)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});if(!isReader){showBookPreview(null);return;}
 const type=kind==='book'||kind==='books'?'book':'note';if(type!==activeType)document.getElementById('search').value='';activeType=type;activeId=isDoc?id:'';document.getElementById('catalog-title').textContent=type==='book'?'Reading notes':'The notebook';document.getElementById('search').placeholder=type==='book'?'Find a book…':'Find a note…';document.getElementById('back-list').textContent=type==='book'?'← All books':'← All notes';renderCatalog();
 const selected=entries.find(e=>e.id===activeId&&e.type===activeType);showBookPreview(selected);reader.classList.toggle('has-selection',!!selected);article.replaceChildren();const status=document.getElementById('document-status');
 if(!selected){status.textContent=isDoc?'This note could not be found. Choose one from the list.':'Select a note.';return}
 status.textContent='Opening note…';try{const response=await fetch(selected.file);if(!response.ok)throw new Error('Missing note');const text=await response.text();if(token!==requestId)return;article.innerHTML=markdown(text);status.textContent='';article.focus({preventScroll:true});if(matchMedia('(max-width:600px)').matches)reader.scrollIntoView({block:'start',behavior:'instant'})}catch{if(token===requestId)status.textContent='This note could not be loaded. Try reloading the page.'}}
books.forEach((b,i)=>{const a=document.createElement('a');a.className='item';a.style.textDecoration='none';a.href=`#book/${b.id}`;a.setAttribute('aria-label',`Read notes: ${b.title}`);a.title=`${b.title} — ${b.author}`;a.innerHTML=`<span class="object" aria-hidden="true">${bookMarkup(b,i)}</span><span class="caption">${escapeHTML(b.title)}<br><small>${escapeHTML(b.author)}</small></span>`;document.getElementById('collection').append(a)});
links.forEach(l=>{const a=document.createElement('a');a.className='saved-link';a.href=l.url;a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('aria-label',`${l.title} — opens in a new tab`);a.innerHTML=`<span><strong>${escapeHTML(l.title)}</strong><small>${l.domain}</small></span><span aria-hidden="true">↗</span>`;document.getElementById('saved-links').append(a)});
document.getElementById('search').addEventListener('input',renderCatalog);document.getElementById('back-list').addEventListener('click',()=>{location.hash=activeType==='book'?'books':'notes'});window.addEventListener('hashchange',route);


const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
let motionPaused=false;
const bookStage=document.getElementById('book-stage'),volumeTilt=document.getElementById('volume-tilt'),motionToggle=document.getElementById('motion-toggle'),turnVolume=document.getElementById('turn-volume');
function syncBookMotion(){const paused=motionPaused||reducedMotion.matches;bookStage.classList.toggle('motion-paused',paused);motionToggle.textContent=reducedMotion.matches?'Motion reduced':motionPaused?'Resume motion':'Pause motion';motionToggle.setAttribute('aria-pressed',String(paused));motionToggle.disabled=reducedMotion.matches;if(reducedMotion.matches){volumeTilt.style.removeProperty('--tilt-x');volumeTilt.style.removeProperty('--tilt-y')}}

}
